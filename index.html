<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
    <main class="app-shell">
        <section class="topbar" aria-label="Room controls">
            <div class="brand-block">
                <p class="eyebrow">PeerJS room</p>
                <h1>VidChat</h1>
                <p id="status" class="status">Starting...</p>
            </div>
            <div class="header-controls">
                <div class="room-actions">
                    <button id="copyRoomLink" class="primary" type="button" title="Copy room link">Copy room link</button>
                    <button id="newRoom" type="button" title="Start a new room">New room</button>
                </div>
                <div class="button-group" aria-label="Media controls">
                    <button id="cameraToggle" type="button">Share camera</button>
                    <button id="screenToggle" type="button">Share screen</button>
                    <label class="check-control" title="Include tab or system audio when the browser offers it">
                        <input id="screenAudio" type="checkbox" checked>
                        <span>Screen audio</span>
                    </label>
                </div>
                <div class="layout-controls" aria-label="Layout controls">
                    <span>Layout</span>
                    <div class="segmented">
                        <button class="layout-button active" type="button" data-layout="grid">Grid</button>
                        <button class="layout-button" type="button" data-layout="spotlight">Spotlight</button>
                        <button class="layout-button" type="button" data-layout="filmstrip">Filmstrip</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="videos" class="video-stage grid" aria-live="polite"></section>
    </main>

    <template id="tileTemplate">
        <article class="video-tile">
            <video playsinline autoplay></video>
            <div class="tile-bar">
                <div>
                    <strong class="tile-title"></strong>
                    <span class="tile-subtitle"></span>
                </div>
                <div class="tile-actions">
                    <button class="focus-button" type="button" title="Focus this video">Focus</button>
                    <button class="audio-button" type="button" title="Adjust this video's audio">Audio</button>
                </div>
            </div>
            <div class="audio-popover" hidden>
                <label class="volume-control" title="Adjust this video's audio">
                    <span>Audio</span>
                    <input class="volume-slider" type="range" min="0" max="1" step="0.05" value="1">
                </label>
            </div>
        </article>
    </template>

    <script src="vidChat.js"></script>
</body>
</html>

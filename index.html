<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeliChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
    <main class="app-shell">
        <section class="topbar" aria-label="Room controls">
            <div class="brand-block">
                <p class="eyebrow">Peer-to-peer Chat Room</p>
                <h1 id="brandName">MeliChat</h1>
                <p id="status" class="status">Starting...</p>
            </div>
            <div class="header-controls">
                <div class="room-actions">
                    <button id="copyRoomLink" class="primary" type="button" title="Copy room link">Copy room link</button>
                    <button id="newRoom" type="button" title="Start a new room">New room</button>
                </div>
                <div class="button-group" aria-label="Media controls">
                    <button id="cameraToggle" type="button">Share camera</button>
                    <button id="screenToggle" type="button">Share screen</button>
                    <button id="screenAudioMute" type="button" class="hidden">Mute Screen</button>
                </div>
                <div class="layout-controls" aria-label="Layout controls">
                    <span>Layout</span>
                    <div class="segmented">
                        <button class="layout-button active" type="button" data-layout="grid">Grid</button>
                        <button class="layout-button" type="button" data-layout="spotlight">Spotlight</button>
                        <button class="layout-button" type="button" data-layout="filmstrip">Filmstrip</button>
                    </div>
                    <button id="openChat" type="button" title="Open chat" aria-label="Open chat" class="relative">
                        <span>💬 Chat</span>
                        <span id="chatBadge" class="chat-badge hidden">0</span>
                    </button>
                    <button id="appSettingsButton" type="button" title="Open settings" aria-label="Open settings">⚙</button>
                </div>
            </div>
        </section>

        <section id="videos" class="video-stage grid" aria-live="polite"></section>
    </main>

    <template id="tileTemplate">
        <article class="video-tile">
            <video playsinline autoplay></video>
            <div class="tile-chip">
                <strong class="tile-title"></strong>
            </div>
            <button class="mute-icon" type="button" title="Mute microphone" aria-label="Mute microphone">🔇</button>
            <button class="tile-settings-button" type="button" title="Open feed settings">⚙</button>
        </article>
    </template>

    <dialog id="chatModal" class="modal chat-modal">
        <form method="dialog" class="modal-panel chat-panel">
            <div class="modal-header">
                <div>
                    <h2>Chat</h2>
                    <p>Message the room</p>
                </div>
                <button value="close" type="submit" title="Close">Close</button>
            </div>
            <div id="chatHistory" class="chat-history"></div>
            <div class="chat-input-row">
                <button id="attachFile" type="button" title="Send a file">🔗</button>
                <input id="fileInput" type="file" class="hidden">
                <div class="autocomplete-wrapper">
                    <input id="chatInput" type="text" placeholder="Type a message... (use : for emojis)" autocomplete="off">
                    <div id="emojiAutocomplete" class="emoji-autocomplete hidden"></div>
                </div>
                <button id="sendChat" type="button" class="primary">Send</button>
            </div>
        </form>
    </dialog>

    <dialog id="feedModal" class="modal">
        <form method="dialog" class="modal-panel">
            <div class="modal-header">
                <div>
                    <h2 id="feedModalTitle">Feed settings</h2>
                    <p id="feedModalSubtitle"></p>
                </div>
                <button value="close" type="submit" title="Close">Close</button>
            </div>
            <div id="feedModalControls" class="modal-controls"></div>
        </form>
    </dialog>

    <dialog id="appSettingsModal" class="modal">
        <form method="dialog" class="modal-panel">
            <div class="modal-header">
                <div>
                    <h2>Settings</h2>
                    <p>Video display behavior</p>
                </div>
                <button value="close" type="submit" title="Close">Close</button>
            </div>
            <div class="modal-controls">
                <label class="setting-row text-setting">
                    <span>Your name</span>
                    <input id="displayName" type="text" maxlength="32" autocomplete="name">
                </label>
                <label class="setting-row text-setting">
                    <span>Chat name</span>
                    <input id="chatNameInput" type="text" maxlength="32">
                </label>
                <label class="setting-row text-setting">
                    <span>Room ID</span>
                    <input id="customRoomId" type="text" maxlength="48" autocomplete="off">
                </label>
                <button id="openCustomRoom" type="button" class="primary">Open room</button>
                <label class="setting-row">
                    <span>Background color</span>
                    <input id="bgColorInput" type="color">
                </label>
                <label class="setting-row">
                    <span>Background image</span>
                    <input id="bgImageInput" type="file" accept="image/*">
                </label>
                <button id="clearBgImage" type="button" class="danger">Clear image</button>
                <label class="setting-row">
                    <span>Accent color</span>
                    <input id="accentColorInput" type="color">
                </label>
                <label class="setting-row">
                    <input type="radio" name="videoFit" value="contain" checked>
                    <span>Scale to fit</span>
                </label>
                <label class="setting-row">
                    <input type="radio" name="videoFit" value="cover">
                    <span>Fill tile and crop</span>
                </label>
                <label class="setting-row">
                    <input id="mirrorLocalCamera" type="checkbox" checked>
                    <span>Mirror my camera</span>
                </label>
                <section class="connection-summary" aria-label="Peer connection summary">
                    <div class="connection-summary-header">
                        <div>
                            <h3>Peer connections</h3>
                            <p id="connectionSummaryMeta">Open settings to refresh connection details.</p>
                        </div>
                        <button id="refreshConnections" type="button">Refresh</button>
                    </div>
                    <div id="connectionSummary" class="connection-list"></div>
                </section>
            </div>
        </form>
    </dialog>

    <script src="emojiData.js"></script>
    <script src="vidChat.js"></script>
</body>
</html>

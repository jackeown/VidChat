<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
    <main class="app-shell">
        <section class="topbar" aria-label="Room controls">
            <div class="brand-block">
                <p class="eyebrow">PeerJS room</p>
                <h1>VidChat</h1>
                <p id="status" class="status">Starting...</p>
            </div>
            <div class="header-controls">
                <div class="room-actions">
                    <button id="copyRoomLink" class="primary" type="button" title="Copy room link">Copy room link</button>
                    <button id="newRoom" type="button" title="Start a new room">New room</button>
                </div>
                <div class="button-group" aria-label="Media controls">
                    <button id="cameraToggle" type="button">Share camera</button>
                    <button id="screenToggle" type="button">Share screen</button>
                    <label class="check-control" title="Include tab or system audio when the browser offers it">
                        <input id="screenAudio" type="checkbox" checked>
                        <span>Screen audio</span>
                    </label>
                </div>
                <div class="layout-controls" aria-label="Layout controls">
                    <span>Layout</span>
                    <div class="segmented">
                        <button class="layout-button active" type="button" data-layout="grid">Grid</button>
                        <button class="layout-button" type="button" data-layout="spotlight">Spotlight</button>
                        <button class="layout-button" type="button" data-layout="filmstrip">Filmstrip</button>
                    </div>
                    <button id="appSettingsButton" type="button" title="Open settings" aria-label="Open settings">⚙</button>
                </div>
            </div>
        </section>

        <section id="videos" class="video-stage grid" aria-live="polite"></section>
    </main>

    <template id="tileTemplate">
        <article class="video-tile">
            <video playsinline autoplay></video>
            <div class="tile-chip">
                <strong class="tile-title"></strong>
            </div>
            <button class="tile-settings-button" type="button" title="Open feed settings">⚙</button>
        </article>
    </template>

    <dialog id="feedModal" class="modal">
        <form method="dialog" class="modal-panel">
            <div class="modal-header">
                <div>
                    <h2 id="feedModalTitle">Feed settings</h2>
                    <p id="feedModalSubtitle"></p>
                </div>
                <button value="close" type="submit" title="Close">Close</button>
            </div>
            <div id="feedModalControls" class="modal-controls"></div>
        </form>
    </dialog>

    <dialog id="appSettingsModal" class="modal">
        <form method="dialog" class="modal-panel">
            <div class="modal-header">
                <div>
                    <h2>Settings</h2>
                    <p>Video display behavior</p>
                </div>
                <button value="close" type="submit" title="Close">Close</button>
            </div>
            <div class="modal-controls">
                <label class="setting-row text-setting">
                    <span>Your name</span>
                    <input id="displayName" type="text" maxlength="32" autocomplete="name">
                </label>
                <label class="setting-row">
                    <input type="radio" name="videoFit" value="contain" checked>
                    <span>Scale to fit</span>
                </label>
                <label class="setting-row">
                    <input type="radio" name="videoFit" value="cover">
                    <span>Fill tile and crop</span>
                </label>
                <label class="setting-row">
                    <input id="mirrorLocalCamera" type="checkbox" checked>
                    <span>Mirror my camera</span>
                </label>
            </div>
        </form>
    </dialog>

    <script src="vidChat.js"></script>
</body>
</html>
